<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confronto Mockup — R&G Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#0f0f0e;min-height:100vh;display:flex;flex-direction:column}

/* ── SWITCHER BAR ── */
.switcher{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;gap:1rem;
  padding:1rem 2rem;
  background:rgba(15,15,14,0.95);
  backdrop-filter:blur(12px);
  border-bottom:0.5px solid rgba(255,255,255,0.08);
}
.switcher-label{
  font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(255,255,255,0.35);margin-right:0.5rem;
}
.btn{
  font-family:'Outfit',sans-serif;
  font-size:12px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;
  padding:0.6rem 1.75rem;border-radius:3px;cursor:pointer;
  border:0.5px solid rgba(255,255,255,0.15);
  background:transparent;color:rgba(255,255,255,0.4);
  transition:all .25s;
}
.btn:hover{border-color:rgba(255,255,255,0.35);color:rgba(255,255,255,0.75)}
.btn.active{background:#6B5A8E;border-color:#6B5A8E;color:#fff;}
.btn-a.active{background:#1E2440;border-color:#1E2440;}

.version-tag{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;
  font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
  background:rgba(15,15,14,0.8);backdrop-filter:blur(8px);
  color:rgba(255,255,255,0.4);padding:0.4rem 0.9rem;border-radius:2px;
  border:0.5px solid rgba(255,255,255,0.1);
}

/* ── IFRAME WRAPPER ── */
.frame-wrap{
  flex:1;
  padding-top:58px; /* height of switcher */
}
iframe{
  width:100%;
  height:calc(100vh - 58px);
  border:none;
  display:block;
}
</style>
</head>
<body>

<div class="switcher">
  <span class="switcher-label">Versione</span>
  <button class="btn btn-a active" onclick="show('a')">
    Mockup A — 1 foto
  </button>
  <button class="btn btn-b" onclick="show('b')">
    Mockup B — 2 foto
  </button>
</div>

<div class="frame-wrap">
  <iframe id="frame" src="version_a.html" title="Mockup"></iframe>
</div>

<div class="version-tag" id="vtag">Mockup A · 1 foto</div>

<script>
function show(v){
  const frame = document.getElementById('frame');
  const tag = document.getElementById('vtag');
  const btnA = document.querySelector('.btn-a');
  const btnB = document.querySelector('.btn-b');
  if(v === 'a'){
    frame.src = 'version_a.html';
    btnA.classList.add('active');
    btnB.classList.remove('active');
    tag.textContent = 'Mockup A · 1 foto';
  } else {
    frame.src = 'version_b.html';
    btnB.classList.add('active');
    btnA.classList.remove('active');
    tag.textContent = 'Mockup B · 2 foto';
  }
}
</script>
</body>
</html>
